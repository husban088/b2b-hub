services:
  mongodb:
    image: mongo:7
    container_name: b2b-hub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: b2b_integration_hub
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b-hub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: b2b_integration_hub
      # Cloudinary keys are only needed for logo upload - safe to leave empty while testing.
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      # Works without a .env file (local testing only). Set a real value in .env for production.
      Jwt__SecretKey: ${JWT_SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789}
      AWS__Region: ${AWS_REGION:-us-east-1}
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://localhost
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GRAPHQL_HTTP_URL: ${GRAPHQL_HTTP_URL:-http://localhost:8080/graphql}
        GRAPHQL_WS_URL: ${GRAPHQL_WS_URL:-ws://localhost:8080/graphql}
    container_name: b2b-hub-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo_data:
