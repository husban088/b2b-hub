<div
  class="modal-backdrop"
  *ngIf="confirm.state() as s"
  [class.closing]="closing()"
  (pointerdown)="onBackdropPress($event)"
  (click)="onBackdropClick($event)"
  role="presentation"
>
  <div
    class="modal-card"
    [ngClass]="'tone-' + s.options.tone"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-message"
    (click)="$event.stopPropagation()"
    (keydown)="onKeydown($event)"
  >
    <div class="modal-icon" [ngSwitch]="s.options.icon">
      <svg
        *ngSwitchCase="'trash'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 6h18" />
        <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
        <path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6" />
        <path d="M10 11v6M14 11v6" />
      </svg>
      <svg
        *ngSwitchCase="'refresh'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4" />
        <path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4" />
      </svg>
      <svg
        *ngSwitchCase="'logout'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      <svg
        *ngSwitchDefault
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v8M8 12h8" />
      </svg>
    </div>

    <h3 id="confirm-title">{{ s.options.title }}</h3>
    <p id="confirm-message" class="modal-message">{{ s.options.message }}</p>

    <div class="modal-actions">
      <button
        type="button"
        class="btn modal-btn"
        #cancelBtn
        (click)="dismiss(false)"
      >
        {{ s.options.cancelText }}
      </button>
      <button
        type="button"
        class="btn modal-btn"
        [ngClass]="
          s.options.tone === 'danger' ? 'btn-danger-solid' : 'btn-primary'
        "
        #okBtn
        (click)="dismiss(true)"
      >
        {{ s.options.confirmText }}
      </button>
    </div>
  </div>
</div>
